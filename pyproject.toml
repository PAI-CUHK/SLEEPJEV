[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepjev"
version = "0.1.0"
description = "Runtime semantic decisions over long-horizon PSG representations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
keywords = ["sleep-analysis", "polysomnography", "PSG", "event-retrieval", "JEV"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sleep = ["pandas>=2.0", "pyedflib>=0.1.38"]
train = ["pandas>=2.0", "pyedflib>=0.1.38"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["build>=1", "ruff>=0.8", "pre-commit>=3.7"]
all = [
    "pandas>=2.0",
    "pyedflib>=0.1.38",
    "pytest>=8",
    "pytest-cov>=5",
    "build>=1",
    "ruff>=0.8",
]

[project.scripts]
sleepjev = "sleepjev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sleepjev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E701/E702 are retained for compatibility with compact research scripts that
# predate this repository's src-layout migration. New modules should avoid them.
ignore = ["E501", "E701", "E702"]
