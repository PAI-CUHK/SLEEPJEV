<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc">
  <title id="title">SLEEPJEV overall framework</title>
  <desc id="desc">An overnight PSG becomes a shared hierarchical cache and is queried through sparse retrieval and an option-conditioned scorer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" fill="#315a72"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a43" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1500" height="660" fill="#fff"/>
  <text x="60" y="58" fill="#102a43" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700">SLEEPJEV: shared overnight state, runtime semantic decision</text>
  <text x="60" y="91" fill="#557080" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17">One signal encoding supports many explicit queries over time, stage, position, and event evidence.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="160" width="220" height="230" rx="12" fill="#e9f6f5" stroke="#0b8f87" stroke-width="2"/>
    <rect x="325" y="160" width="255" height="230" rx="12" fill="#eef4fb" stroke="#4a75a5" stroke-width="2"/>
    <rect x="630" y="160" width="240" height="230" rx="12" fill="#f3f5f6" stroke="#78909c" stroke-width="2"/>
    <rect x="920" y="160" width="245" height="230" rx="12" fill="#fff3ee" stroke="#e07a5f" stroke-width="2"/>
    <rect x="1215" y="160" width="230" height="230" rx="12" fill="#f0f7f5" stroke="#0b8f87" stroke-width="2"/>
  </g>
  <g fill="#102a43" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="82" y="202" font-size="22" font-weight="700">8-hour PSG</text>
    <text x="82" y="235" font-size="16">epoch features</text>
    <path d="M78 315h28l13-35 18 66 20-81 16 54h38l12-24 17 20 24-6" fill="none" stroke="#0b8f87" stroke-width="4" stroke-linecap="round"/>
    <text x="352" y="202" font-size="22" font-weight="700">Shared state</text>
    <text x="352" y="238" font-size="16">local epoch tokens</text>
    <text x="352" y="267" font-size="16">coarse / hour states</text>
    <text x="352" y="296" font-size="16">night token</text>
    <rect x="353" y="323" width="195" height="34" rx="7" fill="#fff" stroke="#4a75a5"/>
    <text x="367" y="346" font-size="15">SleepCache</text>
    <text x="657" y="202" font-size="22" font-weight="700">Serving index</text>
    <text x="657" y="238" font-size="16">predicted stages</text>
    <text x="657" y="267" font-size="16">event postings</text>
    <text x="657" y="296" font-size="16">time / stage filters</text>
    <text x="657" y="346" font-size="15" fill="#557080">label-free at serving time</text>
    <text x="947" y="202" font-size="22" font-weight="700">Runtime query</text>
    <text x="947" y="238" font-size="16">target + window</text>
    <text x="947" y="267" font-size="16">stage / position</text>
    <text x="947" y="296" font-size="16">options: W, N2, REM</text>
    <rect x="947" y="322" width="185" height="35" rx="7" fill="#fff" stroke="#e07a5f"/>
    <text x="962" y="345" font-size="15">SleepQuery</text>
    <text x="1242" y="202" font-size="22" font-weight="700">Decision</text>
    <text x="1242" y="238" font-size="16">sparse retrieval</text>
    <text x="1242" y="267" font-size="16">shared scorer</text>
    <text x="1242" y="296" font-size="16">option probabilities</text>
    <rect x="1242" y="321" width="170" height="38" rx="7" fill="#0b8f87"/>
    <text x="1257" y="346" font-size="15" fill="#fff">P(W), P(N2), P(REM)</text>
  </g>
  <g fill="none" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)">
    <path d="M275 275h45"/><path d="M580 275h45"/><path d="M870 275h45"/><path d="M1165 275h45"/>
  </g>
  <path d="M1040 430v80H455v-80" fill="none" stroke="#e07a5f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="625" y="548" fill="#e07a5f" font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">one overnight encoding, many runtime questions</text>
</svg>
